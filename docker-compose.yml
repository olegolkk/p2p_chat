version: '3.8'

services:
  signaling-server:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: unless-stopped