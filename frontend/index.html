<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Encrypted Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo">
                <h2>🔒 P2P Chat</h2>
                <p class="subtitle">Сквозное шифрование</p>
            </div>

            <!-- Панель подключения -->
            <div class="connection-panel card">
                <h3>Подключение</h3>
                <div class="form-group">
                    <label>Сервер</label>
                    <input type="text" id="signalingUrl" value="ws://localhost:8000/ws" placeholder="ws://server:8000/ws">
                </div>
                <div class="form-group">
                    <label>Комната</label>
                    <input type="text" id="roomId" value="main-room" placeholder="ID комнаты">
                </div>
                <div class="form-group">
                    <label>Ваш ID</label>
                    <input type="text" id="userId" placeholder="Оставьте пустым для генерации">
                </div>
                <button id="connectBtn" class="btn btn-primary">🔌 Подключиться</button>
                <button id="disconnectBtn" class="btn btn-danger" disabled>❌ Отключиться</button>
            </div>

            <!-- Список пользователей -->
            <div class="users-panel card">
                <h3>👥 Пользователи онлайн</h3>
                <div id="usersList" class="users-list">
                    <div class="empty-message">Нет подключённых пользователей</div>
                </div>
            </div>
        </aside>

        <!-- Основная область чата -->
        <main class="chat-area">
            <div class="chat-header">
                <h3 id="chatTitle">💬 Выберите собеседника</h3>
                <div id="connectionStatus" class="status status-disconnected">⛔ Отключён</div>
            </div>

            <div id="chatMessages" class="chat-messages">
                <div class="system-message">✨ Подключитесь к серверу и выберите пользователя для чата</div>
            </div>

            <div class="chat-input">
                <textarea id="messageInput" placeholder="Введите сообщение..." disabled rows="3"></textarea>
                <div class="input-actions">
                    <button id="sendBtn" class="btn btn-primary" disabled>📨 Отправить</button>
                    <label class="btn btn-secondary" id="fileLabel">
                        📎 Файл
                        <input type="file" id="fileInput" style="display: none">
                    </label>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
